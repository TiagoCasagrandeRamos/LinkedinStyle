name: Publicar posts agendados
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/publish"
